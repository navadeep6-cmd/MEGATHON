# Commons category suggester - all tunable settings in one place.
# Paths are relative to the project root.

paths:
  data_dir: data
  artifacts_dir: artifacts
  reports_dir: reports

commons:
  api_url: https://commons.wikimedia.org/w/api.php
  contact: ""                 # or set env COMMONS_CONTACT (e-mail / project URL) - required by Wikimedia UA policy
  thumb_width: 330            # a standard Wikimedia thumbnail step
  max_depth: 2                # subcategory depth crawled below each seed
  files_per_category: 30
  subcats_per_category: 20
  max_files_per_seed: 450
  parent_fetch_depth: 2       # levels of parent categories fetched for the hierarchy
  request_sleep: 0.1          # seconds between API calls
  download_workers: 4
  # Seeds span the four semantic types and many regions (inclusivity audit).
  seeds:
    object: [Bicycles, Clocks, Teapots, Steam locomotives, Lighthouses, Bridges, Mushrooms, Butterflies,
             Musical instruments, Coins, Aircraft, Buses, Sculptures, Masks, Pottery, Textiles]
    scene: [Beaches, Waterfalls, Mountains, Markets, Libraries, Railway stations, Deserts, Forests,
            Skylines, Harbors, Street scenes, Interiors of churches]
    event: [Festivals, Protests, Concerts, Weddings, Parades, Carnivals, Marathons, Diwali, Holi,
            Chinese New Year, Durga Puja, Association football matches, Fireworks]
    abstract: [Symbols, Emotions, Poverty, Silhouettes, Reflections, Patterns, Shadows, Symmetry,
               Art Nouveau architecture, Graffiti]
    region: [Lagos, Nairobi, Accra, Addis Ababa, Hanoi, Kolkata, Dhaka, Kathmandu, Jakarta, Manila,
             Lima, Bogotá, Istanbul, Cairo, Ulaanbaatar]

labels:
  min_label_count: 1          # vocabulary: categories seen at least this often across the dataset
  head_min_train_count: 10    # supervised head covers categories with >= this many training images
  tail_max: 9                 # bands by training frequency: 0 zero-shot | 1-9 tail | 10-49 torso | 50+ head
  torso_max: 49
  exclude_person_categories: true
  add_parent_distractors: true  # parent categories join the vocabulary as distractors (no closed world)
  extra_drop_patterns: []     # additional regexes for maintenance categories

split:
  mode: temporal_grouped      # temporal | temporal_grouped (uploader-disjoint)
  val_frac: 0.1
  test_frac: 0.1
  dhash_max_distance: 4       # perceptual-hash near-duplicate threshold (bits of 64)
  embed_dup_threshold: 0.97   # cosine threshold for embedding near-duplicates

encoder:
  model: ViT-B-16
  pretrained: laion2b_s34b_b88k
  device: auto                # auto | cuda | mps | cpu
  batch_size: 64
  num_workers: 0              # DataLoader workers (0 is safest on macOS)
  train_aug_views: 1          # degraded copies of each training image (blur/JPEG/downscale/crop)

knn:
  k: 50
  tau: 0.05
  index: flat                 # flat | hnsw | ivfpq (ivfpq needs >= 10k vectors)
  hnsw_m: 32
  ef_search: 128
  ivf_nlist: 1024
  pq_m: 64
  nprobe: 16

geo:
  radius_km: 30
  sigma_km: 5
  max_neighbours: 50

head:
  epochs: 40
  patience: 5
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 512
  gamma_pos: 0.0
  gamma_neg: 4.0
  margin: 0.05
  text_init_scale: 20.0
  init_bias_offset: 3.0

candidates:
  per_scorer: 100             # top-N taken from each scorer; fusion sees only the union
  lex_min: 0.5
  lex_max_df: 2000

fusion:
  model: logreg               # logreg (calibrated, interpretable) | gbdt
  C: 1.0

hierarchy:
  enabled: true
  max_depth: 2
  min_relative_score: 0.5

eval:
  ks: [1, 3, 5, 10]
  top_k: 10
  hier_partial_credit: 0.5
  review_sample_size: 200
  review_k: 5
  robustness_subset: 500
  seed: 0

serve:
  top_k: 10
  min_score: 0.02

monitor:
  min_accept_rate: 0.3
  max_ece: 0.15
